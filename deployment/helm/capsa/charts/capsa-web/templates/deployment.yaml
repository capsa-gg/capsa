apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsa-web-deployment
  labels:
    {{- include "capsa-web.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: capsa-web-app
  template:
    metadata:
      labels:
        {{- include "capsa-web.labels" . | nindent 8 }}
        app: capsa-web-app
    spec:
      containers:
        - name: capsa-web-app
          image: "{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          envFrom:
            - secretRef:
                name: capsa-web-secrets
