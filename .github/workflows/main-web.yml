name: WebMain

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write
  packages: write
  attestations: write
  id-token: write

defaults:
  run:
    working-directory: ./web

env:
  # Docker
  GHCR_REGISTRY: ghcr.io/capsa-gg
  DIGITALOCEAN_REGISTRY: registry.digitalocean.com/capsa
  DOCKER_CONTAINER_NAME: capsa-web
  # Sentry
  SENTRY_AUTH_TOKEN: ${{ vars.SENTRY_AUTH_TOKEN }}
  SENTRY_ORG: capsa-gg
  SENTRY_PROJECT: web

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: NPM Cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-
      - name: Node Modules Cache
        id: nodemodulescache
        uses: actions/cache@v4
        with:
          path: ~/node_modules
          key: ${{ runner.os }}-nodemodules-${{ hashFiles('**/package-lock.json') }}
      - name: NextJS cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.nodemodulescache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Build Next
        run: npm run build
      - name: Jest tests
        run: npm run test
      - name: Lint
        run: npm run check:ci

      # DigitalOcean
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      # Push Docker image to registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: web
          push: true
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME}}:latest,${{ env.DIGITALOCEAN_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.GHCR_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
