name: Commitlint PR

on:
  pull_request:

jobs:
  commitlint-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Validate all commits from PR
        run: npm run commitlint
