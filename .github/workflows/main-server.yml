name: Commitlint PR

on:
  push:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Display Go version
        run: go version
      - name: Bootstrap
        run: make bootstrap
      - name: Run build
        run: make build
      - name: Run ci script
        run: make ci
