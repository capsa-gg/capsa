name: Server

on:
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

defaults:
  run:
    working-directory: ./server

env:
  DOCKER_REGISTRY: registry.digitalocean.com/capsa
  DOCKER_CONTAINER_NAME: capsa-server

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # Caching
      - name: Set up caching
        id: go-cache-paths
        run: |
          echo "::set-output name=go-build::$(go env GOCACHE)"
          echo "::set-output name=go-mod::$(go env GOMODCACHE)"
      - name: Go Build Cache
        uses: actions/cache@v2
        with:
          path: ${{ steps.go-cache-paths.outputs.go-build }}
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
      - name: Go Mod Cache
        uses: actions/cache@v2
        with:
          path: ${{ steps.go-cache-paths.outputs.go-mod }}
          key: ${{ runner.os }}-go-mod-${{ hashFiles('**/go.sum') }}

      # Run CI scripts
      - name: Display Go version
        run: go version
      - name: Bootstrap
        run: make bootstrap
      - name: Run build on all platforms
        run: make build-all
      - name: Run ci script
        run: make ci

      # Deployment
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build container image
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}:latest .
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200
      - name: Push image to DigitalOcean Container Registry
        run: docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}:latest

      # Slackbot message
      - name: Send message via Slack webhook
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"The main branch on GitHub has just received a new commit. The new version will be deployed in a few seconds.\n\n*Commit Message:*\n${{ github.event.head_commit.message }}"}' \
            ${{ secrets.SLACK_WEBHOOK }}
