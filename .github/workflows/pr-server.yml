name: Server PR

on:
  pull_request:
    paths:
      - "server/**"

permissions:
  pull-requests: write
  contents: read

defaults:
  run:
    working-directory: ./server

env:
  DOCKER_REGISTRY: registry.digitalocean.com/lucianonooijen
  DOCKER_CONTAINER_NAME: capsa-server

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Display Go version
        run: go version
      #      - name: Bootstrap
      #        run: make bootstrap
      #      - name: Run build for all platforms
      #        run: make build-all
      #      - name: Run ci script
      #        run: make ci
      #      - name: Coverage report
      #        uses: irongut/CodeCoverageSummary@v1.3.0
      #        with:
      #          filename: server/cobertura.xml
      #          badge: true
      #          fail_below_min: false
      #          format: markdown
      #          hide_branch_rate: false
      #          hide_complexity: false
      #          indicators: true
      #          output: both
      #      - name: Publish Test Report
      #        uses: mikepenz/action-junit-report@v5
      #        if: success() || failure() # always run even if the previous step fails
      #        with:
      #          report_paths: 'server/junit.xml'
      #      - name: Add Coverage PR Comment
      #        uses: marocchino/sticky-pull-request-comment@v2
      #        with:
      #          recreate: true
      #          path: code-coverage-results.md

      # TODO: Move to main-server.yml
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - name: Build container image
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}:latest .
      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200
      - name: Push image to DigitalOcean Container Registry
        run: docker push ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_CONTAINER_NAME }}:latest
