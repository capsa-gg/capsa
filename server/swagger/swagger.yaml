securityDefinitions:
  JwtAdmin:
    description: Header value should be "Bearer UserJwtString", this JWT is similar
      to JwtUser, but contains the "Admin" role
    in: header
    name: Authorization
    type: apiKey
  JwtClient:
    description: Header value should be "Bearer ClientJwtString"
    in: header
    name: Authorization
    type: apiKey
  JwtUser:
    description: Header value should be "Bearer UserJwtString", JwtAdmin also works
      for this endpoint
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
