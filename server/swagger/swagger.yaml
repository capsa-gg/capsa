basePath: /v1
definitions:
  bodies.AddEnvironmentRequest:
    properties:
      environment:
        maxLength: 24
        minLength: 3
        type: string
      title:
        maxLength: 24
        minLength: 3
        type: string
    required:
    - environment
    - title
    type: object
  bodies.AddTitleRequest:
    properties:
      title:
        maxLength: 24
        minLength: 3
        type: string
    required:
    - title
    type: object
  bodies.ClientLogCreationRequest:
    properties:
      key:
        type: string
      platform:
        maxLength: 64
        type: string
      type:
        description: Needs manual validation for enum
        maxLength: 32
        type: string
    required:
    - key
    - platform
    - type
    type: object
  bodies.ClientLogCreationResponse:
    properties:
      expiry:
        type: string
      link_web:
        type: string
      log_id:
        type: string
      token:
        type: string
    type: object
  bodies.ErrorResponse:
    properties:
      details:
        description: |-
          Details contains details about the error.
          This field is mostly for development, but is used in production for adding request body validation errors.
        type: string
      error:
        description: Error contains the error string.
        type: string
      raw_error:
        description: |-
          RawError contains the raw error.
          This field is only sent in development mode.
        type: string
    type: object
  bodies.LogAdditionalMetadata:
    properties:
      metadata:
        additionalProperties: {}
        type: object
      savedOn:
        type: string
    type: object
  bodies.LogInfo:
    properties:
      categoriesCounts:
        additionalProperties:
          type: integer
        type: object
      chunkCount:
        type: integer
      environment:
        type: string
      id:
        type: string
      lineCount:
        type: integer
      linkedLogCount:
        type: integer
      logType:
        type: string
      platform:
        type: string
      severitiesCounts:
        additionalProperties:
          type: integer
        type: object
      title:
        type: string
      tsFirstLine:
        type: string
      tsLastLine:
        type: string
    type: object
  bodies.LogLink:
    properties:
      description:
        type: string
      linkedLog:
        type: string
    type: object
  bodies.LogMetadata:
    properties:
      additionalMetadata:
        items:
          $ref: '#/definitions/bodies.LogAdditionalMetadata'
        type: array
      linkedLogs:
        items:
          $ref: '#/definitions/bodies.LogLink'
        type: array
      logData:
        $ref: '#/definitions/bodies.LogInfo'
    type: object
  bodies.LogMetadataSaveRequest:
    properties:
      additional_metadata:
        additionalProperties: {}
        type: object
      log_links:
        additionalProperties:
          type: string
        type: object
    type: object
  bodies.LogOverview:
    properties:
      hasMore:
        type: boolean
      logs:
        items:
          $ref: '#/definitions/bodies.LogInfo'
        type: array
    type: object
  bodies.SearchResult:
    properties:
      description:
        type: string
      details:
        type: string
      match:
        type: string
      type:
        type: string
    type: object
  bodies.SearchResults:
    properties:
      hasMore:
        type: boolean
      results:
        items:
          $ref: '#/definitions/bodies.SearchResult'
        type: array
    type: object
  bodies.StatusResponse:
    properties:
      code:
        example: 200
        type: integer
      message:
        example: ok
        type: string
      version:
        example: 0.0.1
        type: string
    type: object
  bodies.TitleEnvironmentResponse:
    properties:
      environmentKey:
        type: string
      environmentName:
        type: string
      title:
        type: string
    type: object
  bodies.TitleResponse:
    properties:
      createdOn:
        type: string
      title:
        type: string
    type: object
  bodies.UserCreateRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      role:
        description: Conversion to UserRole happens in handler
        enum:
        - User
        - Admin
        type: string
    required:
    - email
    - firstName
    - lastName
    type: object
  bodies.UserInfoResponse:
    properties:
      createdAt:
        type: string
      deactivatedTs:
        type: string
      email:
        type: string
      firstName:
        type: string
      hasPasswordSet:
        type: boolean
      lastName:
        type: string
      role:
        type: string
      userUuid:
        type: string
    type: object
  bodies.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 64
        minLength: 12
        type: string
    required:
    - email
    - password
    type: object
  bodies.UserLoginResult:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      role:
        type: string
      token:
        type: string
      tokenExpiry:
        type: string
      userUUID:
        type: string
    type: object
  bodies.UserPasswordResetCompleteRequest:
    properties:
      password:
        maxLength: 64
        minLength: 12
        type: string
      resetToken:
        type: string
    required:
    - password
    - resetToken
    type: object
  bodies.UserUpdateRequest:
    properties:
      firstName:
        type: string
      lastName:
        type: string
      role:
        description: Conversion to UserRole happens in domain
        enum:
        - User
        - Admin
        type: string
    required:
    - firstName
    - lastName
    type: object
host: example.com
info:
  contact:
    email: capsa@lucianonooijen.com
    name: Luciano Nooijen
    url: https://capsa.gg
  description: Storage server for Project Capsa, a ground-breaking Unreal Engine logging
    solution
  title: Capsa Server
  version: "1"
paths:
  /admin/environments:
    post:
      description: Allows admins to add new environments for an existing title
      parameters:
      - description: EnvironmentAddRequest
        in: body
        name: environment
        required: true
        schema:
          $ref: '#/definitions/bodies.AddEnvironmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            items:
              $ref: '#/definitions/bodies.TitleEnvironmentResponse'
            type: array
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Add new environment for an existing title
      tags:
      - AdminTitleEnvironment
  /admin/titles:
    get:
      description: Allows admins to add list all titles in the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            items:
              $ref: '#/definitions/bodies.TitleResponse'
            type: array
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: List all titles
      tags:
      - AdminTitleEnvironment
    post:
      description: Allows admins to add new titles
      parameters:
      - description: TitleAddRequest
        in: body
        name: title
        required: true
        schema:
          $ref: '#/definitions/bodies.AddTitleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            items:
              $ref: '#/definitions/bodies.TitleResponse'
            type: array
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Add new title
      tags:
      - AdminTitleEnvironment
  /admin/users:
    get:
      description: Allows admins to fetch all users from the database
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            items:
              $ref: '#/definitions/bodies.UserInfoResponse'
            type: array
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: List all users
      tags:
      - AdminUsers
    post:
      description: Allows admins to create a new user
      parameters:
      - description: UserCreateRequest
        in: body
        name: userinfo
        required: true
        schema:
          $ref: '#/definitions/bodies.UserCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.UserInfoResponse'
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Creates a new user
      tags:
      - AdminUsers
  /admin/users/{useruuid}:
    put:
      description: Allows admins to update a user
      parameters:
      - description: UserUpdateRequest
        in: body
        name: userinfo
        required: true
        schema:
          $ref: '#/definitions/bodies.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.UserInfoResponse'
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Update a user's info in the database
      tags:
      - AdminUsers
  /admin/users/{useruuid}/activation:
    delete:
      description: Allows admins to deactivate a user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.UserInfoResponse'
        "304":
          description: User already deactivated
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Deactivate a user's account
      tags:
      - AdminUsers
    post:
      description: Allows admins to reactivate a deactivated user
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.UserInfoResponse'
        "304":
          description: User already activated
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtAdmin: []
      summary: Reactivate a deactivated user's account
      tags:
      - AdminUsers
  /client/auth:
    post:
      consumes:
      - application/json
      description: Allows clients to create a log session and receive a token to send
        logs with
      parameters:
      - description: ClientLogCreationRequest
        in: body
        name: creation_request
        required: true
        schema:
          $ref: '#/definitions/bodies.ClientLogCreationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ClientLogCreationResponse'
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "401":
          description: Unauthorized
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "403":
          description: Forbidden
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "409":
          description: Conflict
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      summary: Client authentication handler
      tags:
      - Client
  /client/log/chunk:
    post:
      consumes:
      - text/plain
      - application/gzip
      description: Allows clients to upload log chunks for their log sessions. To
        test this endpoint, please run the upload locally to add the correct request
        body.
      parameters:
      - description: Log contents, in line with the Content-Type specified
        in: body
        name: log
        required: true
        schema:
          type: string
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "304":
          description: Not Modified
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "415":
          description: Unsupported Media Type
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtClient: []
      summary: Log chunk storage
      tags:
      - ClientAuthenticated
  /client/log/metadata:
    post:
      consumes:
      - application/json
      description: Allows clients to store linked logs and additional metadata for
        their log session
      parameters:
      - description: LogMetadataSaveRequest
        in: body
        name: metadata
        required: true
        schema:
          $ref: '#/definitions/bodies.LogMetadataSaveRequest'
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      security:
      - JwtClient: []
      summary: Log metadata storage
      tags:
      - ClientAuthenticated
  /status:
    get:
      description: To be used with for status pings to check readiness and liveliness
        of the server
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.StatusResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.StatusResponse'
      summary: Status handler
      tags:
      - Common
  /user/auth/login:
    post:
      consumes:
      - application/json
      description: Allows clients to create a log session and receive a token to send
        logs with
      parameters:
      - description: UserLoginRequest
        in: body
        name: login_request
        required: true
        schema:
          $ref: '#/definitions/bodies.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.UserLoginResult'
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "401":
          description: Unauthorized
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "403":
          description: Forbidden
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "409":
          description: Conflict
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      summary: User login handler
      tags:
      - UserAuthentication
  /user/auth/password-reset:
    get:
      description: Allows clients to create a log session and receive a token to send
        logs with
      parameters:
      - description: UserEmail
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
        "400":
          description: Bad Request
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "404":
          description: Not Found
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Capsa-Server-Version:
              description: Current Capsa Server version
              type: string
          schema:
            $ref: '#/definitions/bodies.ErrorResponse'
      summary: User password reset request
      tags:
      - UserAuthentication
    post:
      description: Allows clients to create a log session and receive a token to send
        logs with
      parameters:
      - description: UserEmail
        in: query
        name: email
        required: true
        type: string
      - description: UserPasswordCompleteRequest
        in: body
        name: password_reset_data
        required: true
        schema:
          $ref: '#/definitions/bodies.UserPasswordResetCompleteRequest'
      produces:
